server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  # Edit this to point at your own Loki before enabling the
  # "logging" profile -- there's no cluster-provided one here.
  - url: http://CHANGE-ME:3100/loki/api/v1/push
scrape_configs:
  - job_name: floci-deception
    static_configs:
      - targets: [localhost]
        labels:
          job: floci-deception
          log_type: cloudtrail
          __path__: /var/log/floci-ct/access.log

apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci-deception
  namespace: floci-deception
  labels:
    app: floci-deception
spec:
  replicas: 1
  selector:
    matchLabels:
      app: floci-deception
  template:
    metadata:
      labels:
        app: floci-deception
    spec:
      # No shared PID namespace: with it on, `ps aux` inside a compromised
      # container shows every other container's full command line —
      # envoy's args, floci's own process name, promtail's config path.
      # Nothing here actually needs cross-container process visibility
      # (everything talks over loopback, not signals), so it stays off.
      #
      # Deny-by-default posture against the pod ever being fingerprinted
      # as Kubernetes or reaching the API server:
      automountServiceAccountToken: false   # no token/ca.crt/namespace files, no real credential to steal
      enableServiceLinks: false             # no KUBERNETES_SERVICE_HOST/PORT env vars
      # Docker-style random-hex hostname — this is what a plain `docker
      # run` container gets by default (a short container ID), not an
      # EC2 instance name and not a ReplicaSet-hash pod name. Coherent
      # with the /etc/hosts and /.dockerenv facade below: real Docker
      # containers essentially never inherit their host VM's hostname.
      hostname: 16f4c16e35b8
      # No cluster DNS: dnsPolicy:None + explicit nameservers means
      # resolv.conf never gets the "search <ns>.svc.cluster.local
      # svc.cluster.local cluster.local" lines kubelet would otherwise add.
      # Safe to drop cluster DNS entirely here — the honeypot redirect
      # (iptables REDIRECT by destination port) doesn't depend on what
      # amazonaws.com resolves to, and envoy talks to floci by static IP.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
      initContainers:
        # Installs an iptables NAT rule so port 443 leaving THIS pod's
        # netns gets REDIRECTed to the envoy sidecar on loopback,
        # regardless of what host the client actually dialed. This is why
        # no --endpoint-url or AWS_ENDPOINT_URL is required — interception
        # happens below the application layer.
        - name: iptables-setup
          image: nicolaka/netshoot:latest
          command: ["/bin/sh", "/scripts/setup.sh"]
          env:
            # Shared script also runs unmodified under Compose, where
            # this is left unset and the carve-out is just skipped.
            - name: LOG_SHIP_ALLOW_IP
              value: "100.103.210.114"
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
            runAsUser: 0
          volumeMounts:
            - name: iptables-script
              mountPath: /scripts

      containers:
        # The actual bait: Ray 2.9.0, vulnerable to the "ShadowRay"-class
        # issue (CVE-2025-62593 and its predecessor CVE-2023-48022) — the
        # Ray dashboard/job-submission API has no real authentication by
        # design. A direct network attacker doesn't even need this CVE's
        # specific DNS-rebinding/User-Agent-spoofing trick (that's only
        # for tricking a victim's *browser* into same-origin bypass) —
        # they just POST straight to /api/jobs/ with a shell command as
        # the entrypoint. No auth, no fragile payload construction (this
        # replaced an earlier Langflow pick — CVE-2026-9198's exec chain
        # needed an undocumented lambda/generator-wrapped function shape
        # that wasn't worth fighting further). Fixed in 2.52.0 — this pin
        # is deliberate. CISA KEV added it 2026-08-17, linked to active
        # abuse by the RondoDox botnet.
        #
        # Thematically apt: Ray clusters routinely hold cloud credentials
        # for autoscaling compute — "attacker RCEs an ML training
        # cluster and finds cloud creds in its environment" is exactly
        # the ShadowRay campaigns' real-world pattern, not a contrived
        # one. Shares this pod's network namespace, so any AWS call the
        # attacker's submitted job makes gets captured automatically.
        # Keep the command wrapper — it strips the KUBERNETES_* env vars
        # kubelet injects unconditionally, so the real app never sees
        # them either.
        - name: ml-worker
          image: rayproject/ray:2.9.0-py311
          command:
            - /scripts/entrypoint.sh
            - ray
            - start
            - --head
            - --dashboard-host=0.0.0.0
            - --block
          ports:
            - containerPort: 8265
              name: dashboard
          # Default is /dev/termination-log — a famous, unconditionally-
          # mounted k8s-only file that a lot of automated "is this
          # Kubernetes" scripts grep for by exact path. The mount itself
          # can't be removed, but renaming it off a script's wordlist is
          # the practical mitigation.
          terminationMessagePath: /var/log/.exitstatus
          envFrom:
            - secretRef:
                name: canary-aws-creds
          env:
            # aws-cli / botocore honor these directly — no code changes
            # needed in the app to trust the interception CA. Path and
            # filename kept generic on purpose: `env` is the first thing
            # a compromised shell gets run in it, and a name like
            # ".../mitmproxy-ca-cert.pem" would confess the interception
            # outright.
            - name: AWS_CA_BUNDLE
              value: /ca-bundle/ca-bundle.pem
            - name: REQUESTS_CA_BUNDLE
              value: /ca-bundle/ca-bundle.pem
            - name: SSL_CERT_FILE
              value: /ca-bundle/ca-bundle.pem
          volumeMounts:
            - name: ca-bundle
              mountPath: /ca-bundle
              readOnly: true
            - name: aws-creds
              # Ray's image runs as uid 1000 "ray" with HOME=/home/ray
              # (checked via `docker run --entrypoint sh ... echo $HOME`
              # — learned from the earlier Langflow mount, where /root
              # was wrong for that image's non-root user too). Mounting
              # the standard ~/.aws/credentials path here is realistic
              # bait; the env vars below are what boto3 actually checks
              # first anyway.
              mountPath: /home/ray/.aws/credentials
              subPath: credentials
              readOnly: true
            - name: iam-policy
              # Sits next to the real credentials file. A Deny-unless-
              # SourceVpce condition reads as "this key won't work off
              # our network" — nudges an attacker to use it live in this
              # shell instead of bothering to exfiltrate it. floci
              # doesn't enforce IAM at all, so this is pure appearance.
              mountPath: /home/ray/.aws/iam-policy.json
              subPath: iam-policy.json
              readOnly: true
            - name: init-wrapper
              mountPath: /scripts
              readOnly: true
            - name: hostfiles
              mountPath: /etc/hosts
              subPath: hosts
            - name: hostfiles
              mountPath: /.dockerenv
              subPath: dockerenv

        # TLS-terminating sidecar: envoy decrypts the redirected 443
        # traffic with a static *.amazonaws.com leaf cert (signed by our
        # CA, so the decoy-app's AWS_CA_BUNDLE trusts it) and forwards
        # every request as-is to floci:4566 over plain HTTP. No per-flow
        # scripting, no outbound dialing — static config only.
        - name: envoy-sidecar
          image: envoyproxy/envoy:v1.31-latest
          args: ["-c", "/etc/envoy/envoy.yaml"]
          # The IMDS listener's Lua filter hands these back as the fake
          # role's credentials — same canary key, one more path to find it.
          envFrom:
            - secretRef:
                name: canary-aws-creds
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: tls-leaf
              mountPath: /certs
              readOnly: true
            - name: ct-logs
              mountPath: /var/log/floci-ct

        # Tails Envoy's file-based CloudTrail-shaped access log and ships
        # it to the cluster's existing Loki (over Tailscale) so it's
        # queryable with LogQL like real CloudTrail: e.g.
        # {job="floci-deception"} | json | eventName="CreateUser"
        - name: promtail
          image: grafana/promtail:latest
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          volumeMounts:
            - name: ct-logs
              mountPath: /var/log/floci-ct
              readOnly: true
            - name: promtail-config
              mountPath: /etc/promtail

        # The honeypot itself: 75-service AWS emulator on :4566, dummy
        # creds accepted, real engines for Lambda/RDS/etc. This is what
        # every intercepted AWS call actually lands on.
        - name: floci
          image: floci/floci:latest
          ports:
            - containerPort: 4566
              name: edge
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          volumeMounts:
            - name: floci-data
              mountPath: /var/lib/floci

        # floci's storage is in-memory -- every restart comes back
        # completely empty across every service, which is itself a
        # tell (a real compromised account is never this blank).
        # Populates a small, believable resource set on startup, then
        # sleeps forever -- exiting would make the default
        # restartPolicy re-run every create call and pile up
        # duplicate EC2 instances each cycle.
        - name: floci-seed
          image: python:3.12-slim
          command: ["python", "/app/seed-resources.py"]
          volumeMounts:
            - name: seed-script
              mountPath: /app

      volumes:
        - name: iptables-script
          configMap:
            name: honeypot-iptables-setup
            defaultMode: 0555
        - name: init-wrapper
          configMap:
            name: honeypot-env-scrub
            defaultMode: 0555
        - name: hostfiles
          configMap:
            name: honeypot-docker-facade
        - name: envoy-config
          configMap:
            name: honeypot-envoy-config
        - name: tls-leaf
          secret:
            secretName: honeypot-tls-leaf
        - name: ca-bundle
          secret:
            secretName: honeypot-ca-cert
        - name: aws-creds
          secret:
            secretName: canary-aws-creds
            items:
              - key: credentials
                path: credentials
        - name: iam-policy
          configMap:
            name: honeypot-fake-iam-policy
        - name: floci-data
          emptyDir: {}
        - name: ct-logs
          emptyDir: {}
        - name: promtail-config
          configMap:
            name: honeypot-promtail-config
        - name: seed-script
          configMap:
            name: honeypot-seed-script

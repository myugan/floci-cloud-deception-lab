apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-alert-tailer
  namespace: floci-deception-alerts
  labels:
    app: discord-alert-tailer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-alert-tailer
  template:
    metadata:
      labels:
        app: discord-alert-tailer
    spec:
      containers:
        - name: tailer
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir --quiet websocket-client requests && exec python /app/tailer.py
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-webhook
                  key: url
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: discord-alert-tailer-script
